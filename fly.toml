app = "accessflow-toronto"
primary_region = "yyz"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  ACCESSFLOW_REPOSITORY_BACKEND = "artifact"
  ACCESSFLOW_MODEL_DIR = "/app/data/models/impact"
  ACCESSFLOW_CORS_ORIGINS = "*"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
