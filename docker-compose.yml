version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ACCESSFLOW_REPOSITORY_BACKEND=artifact
      - ACCESSFLOW_MODEL_DIR=/app/data/models/impact
      - ACCESSFLOW_CORS_ORIGINS=http://localhost:3000,http://localhost:3001,http://localhost:8080
      # Set ACCESSFLOW_API_TOKEN to require bearer auth on /api/v1/* (leave empty for open dev mode)
      - ACCESSFLOW_API_TOKEN=
      - ACCESSFLOW_RATE_LIMIT_REQUESTS=240
      - ACCESSFLOW_RATE_LIMIT_WINDOW=60
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  db:
    image: postgis/postgis:16-3.4
    environment:
      - POSTGRES_DB=accessflow
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  console:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./apps/console:/usr/share/nginx/html:ro
    depends_on:
      - api

  scheduler:
    build: .
    command: python -m src.ingestion.runner
    environment:
      - DATA_DIR=/app/data
      - CHECK_INTERVAL_HOURS=24
    volumes:
      - ./data:/app/data
    restart: unless-stopped

volumes:
  postgres_data:
